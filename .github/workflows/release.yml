name: Build and Release (Lua 5.1)

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev

      - name: Install Lua 5.1.5
        run: |
          curl -L -R -O https://www.lua.org/ftp/lua-5.1.5.tar.gz
          tar -xzf lua-5.1.5.tar.gz
          cd lua-5.1.5
          make linux test
          sudo make install
          cd ..

      - name: Verify Lua version
        run: lua -v

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Run release build script
        run: bash exe/compile

      - name: Upload ZIP and folder as release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            var/output/s6communitylib.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}